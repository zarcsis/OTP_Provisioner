# METABEGIN
# X-Env-Layer-Name: otp-image
# X-Env-Layer-Category: device
# X-Env-Layer-Desc: Station settings read from files instead of variables
#  (rpi-image-gen expands $ in variable values, which would mangle a crypt hash
#  or a passphrase): the user1 password hash and the iwd network profiles.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: device-user-admin,iwd
#
# X-Env-VarPrefix: otp
#
# X-Env-Var-secrets:
# X-Env-Var-secrets-Desc: Directory holding user1.passhash (one line, a crypt(3)
#  hash for user1, applied with chpasswd -e) and iwd/ (iwd network profiles,
#  installed into /var/lib/iwd with mode 0600). Empty: nothing is installed.
# X-Env-Var-secrets-Required: n
# X-Env-Var-secrets-Valid: string-or-empty
# X-Env-Var-secrets-Set: y
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      d=${IGconf_otp_secrets:-}
      if [ -n "$d" ] && [ -s "$d/user1.passhash" ]; then
         printf '%s:%s\n' "$IGconf_device_user1" "$(head -n1 "$d/user1.passhash")" | chroot $1 chpasswd -e
      fi
    - |-
      set -eu
      d=${IGconf_otp_secrets:-}
      if [ -n "$d" ] && [ -d "$d/iwd" ]; then
         for f in "$d"/iwd/*; do
            [ -f "$f" ] || continue
            install -m 0600 -o root -g root "$f" "$1/var/lib/iwd/${f##*/}"
         done
      fi
