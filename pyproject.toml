# OTP_Provisioner server. uv (https://docs.astral.sh/uv/) manages the Python (.python-version) and the
# packages (uv.lock) in .venv:  uv run server.py   (tests: uv run --group dev python -B -m pytest -q)
[project]
name = "otp-provisioner"
version = "0.2.0"
description = "Raspberry Pi 5 provisioning station: OTP key, signed boot, encrypted OS image"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "cryptography>=50",
    # Google sign-in + the station spreadsheet (settings and the board registry live in Google Sheets)
    "gspread>=6.2",
    "google-auth>=2.62",
    "google-auth-oauthlib>=1.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Not a package: nothing is built or installed from the repository itself, server.py runs from the tree.
package = false
# A station runs the server only; the tests ask for their group (--group dev).
default-groups = []
# Only uv's own Python builds (python-build-standalone), the newest patch release of the minor version in
# .python-version: a system Python (installed, updated or removed) changes nothing, and .venv points at uv's
# minor-version link, so a patch upgrade (or removal) of uv's Python does not leave it without an interpreter.
python-preference = "only-managed"
