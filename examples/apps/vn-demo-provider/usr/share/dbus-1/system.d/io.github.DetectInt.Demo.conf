<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- vn-demo-provider owns the name. Its interface may be called by root and by the group vnapps:
       the D-Bus proxies of the sandboxed apps run as the apps' own users, all members of vnapps (the
       station creates them in the image). The service still checks every caller's UID against
       /etc/vn-apps/registry.json: this policy only keeps everyone else away. -->
  <policy user="vn-demo"><allow own="io.github.DetectInt.Demo"/></policy>
  <policy user="root">
    <allow send_destination="io.github.DetectInt.Demo"/>
  </policy>
  <policy group="vnapps">
    <allow send_destination="io.github.DetectInt.Demo" send_interface="io.github.DetectInt.Demo1"/>
  </policy>
</busconfig>
